name: CI - Algorithm Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # ============================================================
    # CHECKOUT
    # ============================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    # JAVA 21
    # ============================================================
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    # ============================================================
    # PYTHON
    # ============================================================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # ============================================================
    # PERMISSÃO GRADLE
    # ============================================================
    - name: Grant execute permission
      run: chmod +x gradlew

    # ============================================================
    # BUILD
    # ============================================================
    - name: Build project
      run: ./gradlew build

    # ============================================================
    # EXECUTAR BENCHMARK
    # ============================================================
    - name: Run benchmark
      run: ./gradlew run --args="benchmark"

    # ============================================================
    # PREPARAR CSV ATUAL
    # ============================================================
    - name: Prepare latest CSV
      run: |
        mkdir -p resultados
        CURRENT=$(ls resultados/*.csv | tail -n 1)
        cp "$CURRENT" resultados/latest.csv

    # ============================================================
    # INSTALAR DEPENDÊNCIAS PYTHON
    # ============================================================
    - name: Install Python deps
      run: pip install matplotlib

    # ============================================================
    # HISTÓRICO + GRÁFICO TEMPORAL
    # ============================================================
    - name: Update history and chart
      run: |
        python scripts/update_history.py
        python scripts/generate_history_chart.py

    # ============================================================
    # GRÁFICO ATUAL (README)
    # ============================================================
    - name: Generate current chart
      run: python scripts/generate_readme_chart.py

    # ============================================================
    # COMPARAÇÃO + REGRESSÃO
    # ============================================================
    - name: Compare runs
      run: |
        PREVIOUS=$(ls docs/dashboard/data/*.csv 2>/dev/null | tail -n 1 || echo "")
        CURRENT=$(ls resultados/*.csv | tail -n 1)

        if [ -n "$PREVIOUS" ]; then
          python scripts/compare_runs.py "$PREVIOUS" "$CURRENT"
        else
          echo "Primeira execução - sem comparação"
        fi

    # ============================================================
    # RELATÓRIO PR
    # ============================================================
    - name: Generate report
      run: |
        PREVIOUS=$(ls docs/dashboard/data/*.csv 2>/dev/null | tail -n 1 || echo "")
        CURRENT=$(ls resultados/*.csv | tail -n 1)

        if [ -n "$PREVIOUS" ]; then
          python scripts/report.py "$PREVIOUS" "$CURRENT" > report.md
        else
          echo "Sem histórico suficiente" > report.md
        fi

    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: report.md

    # ============================================================
    # BADGE
    # ============================================================
    - name: Generate badge
      run: |
        PREVIOUS=$(ls docs/dashboard/data/*.csv 2>/dev/null | tail -n 1 || echo "")
        CURRENT=$(ls resultados/*.csv | tail -n 1)

        if [ -n "$PREVIOUS" ]; then
          python scripts/badge.py "$PREVIOUS" "$CURRENT"
        else
          echo '{"schemaVersion":1,"label":"Performance","message":"first run","color":"blue"}' > docs/badge.json
        fi

    # ============================================================
    # SALVAR CSV NO DASHBOARD
    # ============================================================
    - name: Save CSV to dashboard
      run: |
        mkdir -p docs/dashboard/data
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        cp resultados/*.csv docs/dashboard/data/run_$TIMESTAMP.csv || true

    # ============================================================
    # ATUALIZAR INDEX.JSON
    # ============================================================
    - name: Update index.json
      run: |
        cd docs/dashboard/data
        ls *.csv | jq -R -s -c 'split("\n")[:-1]' > index.json

    # ============================================================
    # COMMIT AUTOMÁTICO
    # ============================================================
    - name: Commit updates
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add docs/performance.png docs/performance_history.json docs/badge.json docs/dashboard/data || true

        git commit -m "update performance data [ci]" || echo "no changes"
        git push

    # ============================================================
    # ARTIFACTS
    # ============================================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: resultados
        path: |
          resultados/
          docs/performance.png
          docs/performance_history.json
          docs/badge.json
        if-no-files-found: warn