name: Benchmark + Dashboard

on:
  push:
    branches: [ main ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      - name: Rodar experimentos
        run: ./gradlew run --no-daemon

      - name: Garantir histórico (fallback)
        run: |
          mkdir -p resultados/historico

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install pandas matplotlib

      - name: Gerar gráfico (seguro)
        run: |
          if [ -f resultados/ordenacao.csv ]; then
            python scripts/generate_chart.py
          fi

      - name: Gerar index.json (seguro)
        run: |
          mkdir -p docs/resultados/historico
          python scripts/generate_index.py || echo "Sem histórico ainda"

      - name: Copiar resultados para docs
        run: |
          mkdir -p docs/resultados
          cp -r resultados/* docs/resultados/ || echo "Nada para copiar"

      - name: Commit automático (à prova de erro)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin main --rebase || true

          git add docs/resultados/ || true

          git commit -m "Atualiza dashboard automaticamente" || true

          git push || true