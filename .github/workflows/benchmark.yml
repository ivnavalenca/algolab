name: Benchmark + Dashboard

on:
  push:
    branches: [ main ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      - name: Rodar experimentos
        run: ./gradlew run --no-daemon

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install pandas matplotlib

      - name: Gerar gráfico
        run: python scripts/generate_chart.py

      - name: Gerar index.json
        run: python scripts/generate_index.py

      - name: Copiar resultados para docs
        run: |
          mkdir -p docs/resultados
          cp -r resultados/* docs/resultados/

      - name: Commit automático
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/resultados/
          git commit -m "Atualiza resultados automaticamente" || echo "Sem mudanças"
          git push