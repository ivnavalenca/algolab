# ============================================================
# 🚀 ALGOLAB PIPELINE COMPLETO
# ============================================================
#
# OBJETIVO:
# - Build do projeto Java
# - Execução de benchmarks
# - Geração de métricas e gráficos
# - Detecção de regressão
# - Geração de badges dinâmicos
# - Publicação do dashboard (GitHub Pages)
#
# ============================================================

name: Algolab Pipeline

# ============================================================
# 🔄 DISPARO DO WORKFLOW
# ============================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ============================================================
# 🧱 JOB 1: BUILD
# ============================================================
jobs:

  build:
    name: 🔧 Build do Projeto
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 📥 Checkout do código
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # ☕ Setup Java
      # ------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------------------------------------------
      # 🔐 Permissão Gradle
      # ------------------------------------------------------
      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # 🧱 Build
      # ------------------------------------------------------
      - name: Build
        run: ./gradlew clean build

  # =========================================================
  # 📊 JOB 2: BENCHMARK
  # =========================================================
  benchmark:
    name: 📊 Execução de Benchmark
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # ▶️ Executa experimentos
      # ------------------------------------------------------
      - name: Rodar Benchmark
        run: ./gradlew run

      # ------------------------------------------------------
      # 📦 Upload dos resultados
      # ------------------------------------------------------
      - name: Upload resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/

  # =========================================================
  # 🧠 JOB 3: ANALYTICS + BADGES + DASHBOARD
  # =========================================================
  analytics:
    name: 🧠 Análise e Dashboard
    needs: benchmark
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 📥 Checkout
      # ------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------
      # 📦 Download dos resultados
      # ------------------------------------------------------
      - name: Download resultados
        uses: actions/download-artifact@v4
        with:
          name: resultados
          path: resultados/

      # ------------------------------------------------------
      # 🐍 Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install matplotlib pandas reportlab

      # ------------------------------------------------------
      # 📁 Preparar estrutura do dashboard
      # ------------------------------------------------------
      - name: Criar estrutura
        run: |
          mkdir -p docs/resultados/historico
          cp -r resultados/* docs/resultados/ || true

      # ======================================================
      # 📊 ANÁLISE
      # ======================================================
      - name: Gerar métricas
        run: python scripts/generate_metrics.py

      - name: Gerar ranking
        run: python scripts/generate_ranking.py

      - name: Gerar timeline
        run: python scripts/generate_timeline.py

      - name: Gerar gráfico
        run: python scripts/generate_graph.py

      - name: Gerar boxplot
        run: python scripts/generate_boxplot.py

      # ======================================================
      # 🚨 REGRESSÃO (FALHA O CI)
      # ======================================================
      - name: Verificar regressão
        run: python scripts/check_regression.py

      # ======================================================
      # 🏷️ BADGES
      # ======================================================
      - name: Badge regressão
        run: python scripts/generate_badge.py

      - name: Badge melhor algoritmo
        run: python scripts/generate_best_badge.py

      - name: Badge tendência
        run: python scripts/generate_trend_badge.py

      - name: Badge qualidade
        run: python scripts/generate_quality_badge.py

      - name: Badge score
        run: python scripts/generate_project_score_badge.py

      - name: Badge maturidade
        run: python scripts/generate_maturity_badge.py

      # ======================================================
      # 📤 COMMIT DOS RESULTADOS
      # ======================================================
      - name: Commit resultados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin main --rebase || true
          git add docs/resultados/
          git commit -m "chore: atualiza dashboard e badges" || true
          git push || true

      # ======================================================
      # 🌐 DEPLOY GITHUB PAGES
      # ======================================================
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs