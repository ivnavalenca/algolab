# ============================================================
# WORKFLOW: Benchmark + Dashboard
# ============================================================
#
# OBJETIVO:
# - Executar os experimentos em Java
# - Gerar arquivos CSV
# - Manter histórico de execuções
# - Atualizar dados do dashboard automaticamente
# - Publicar no GitHub Pages (via /docs)
#
# ============================================================

name: Benchmark + Dashboard

# ============================================================
# DISPARO DO WORKFLOW
# ============================================================
# Executa sempre que houver push na branch main
on:
  push:
    branches: [ main ]

# ============================================================
# JOB PRINCIPAL
# ============================================================
jobs:
  run-benchmark:

    # Máquina virtual usada pelo GitHub
    runs-on: ubuntu-latest

    # Variáveis de ambiente
    env:
      # Evita problema com Node 20 deprecated
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ============================================================
      # 1. BAIXAR O REPOSITÓRIO
      # ============================================================
      - name: Checkout do código
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONFIGURAR JAVA (necessário para rodar o projeto)
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Permite executar o Gradle Wrapper
      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      # ============================================================
      # 3. EXECUTAR EXPERIMENTOS
      # ============================================================
      # Gera CSV + histórico automaticamente
      - name: Rodar experimentos
        run: ./gradlew run --no-daemon

      # ============================================================
      # 4. GARANTIR ESTRUTURA DE PASTAS
      # ============================================================
      - name: Criar pastas necessárias
        run: |
          mkdir -p resultados/historico
          mkdir -p docs/resultados/historico

      # ============================================================
      # 5. COPIAR RESULTADOS PARA O DASHBOARD
      # ============================================================
      # IMPORTANTE: precisa acontecer ANTES do index.json
      - name: Copiar resultados para docs
        run: |
          mkdir -p docs/resultados
          cp -r resultados/* docs/resultados/ || echo "Nada para copiar"

      # ============================================================
      # 6. CONFIGURAR PYTHON (para scripts auxiliares)
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências Python
        run: pip install pandas matplotlib

      # ============================================================
      # 7. GERAR GRÁFICOS (OPCIONAL)
      # ============================================================
      - name: Gerar gráfico
        run: |
          if [ -f docs/resultados/ordenacao.csv ]; then
            python scripts/generate_chart.py
          fi

      # ============================================================
      # 8. GERAR INDEX.JSON (ESSENCIAL PARA O DASHBOARD)
      # ============================================================
      - name: Gerar index.json
        run: |
          python scripts/generate_index.py || echo "Sem histórico ainda"

      # ============================================================
      # 9. COMMIT AUTOMÁTICO DOS RESULTADOS
      # ============================================================
      - name: Commit automático
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # evita conflito de push
          git pull origin main --rebase || true

          # adiciona apenas dados do dashboard
          git add docs/resultados/ || true

          # commit só se houver mudanças
          git commit -m "chore: atualiza dados do dashboard automaticamente" || true

          # envia para o repositório
          git push || true

      # ============================================================
      # 10. LOG FINAL (LINK DO DASHBOARD)
      # ============================================================
      - name: Mostrar URL do Dashboard
        run: |
          echo "Dashboard disponível em:"
          echo "https://ivnavalenca.github.io/algolab/"