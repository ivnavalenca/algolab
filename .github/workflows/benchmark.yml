name: Benchmark + Dashboard

on:
  push:
    branches: [ main ]

jobs:
  run-benchmark:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ============================================================
      # CHECKOUT DO REPOSITÓRIO
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # CONFIGURAR JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      # ============================================================
      # EXECUTAR EXPERIMENTOS
      # ============================================================
      - name: Rodar experimentos
        run: ./gradlew run --no-daemon

      # ============================================================
      # GARANTIR ESTRUTURA DE PASTAS
      # ============================================================
      - name: Criar pastas necessárias
        run: |
          mkdir -p resultados/historico
          mkdir -p docs/resultados/historico

      # ============================================================
      # COPIAR RESULTADOS PARA DOCS (ANTES DO INDEX)
      # ============================================================
      - name: Copiar resultados para docs
        run: |
          mkdir -p docs/resultados
          cp -r resultados/* docs/resultados/ || echo "Nada para copiar"

      # ============================================================
      # CONFIGURAR PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: pip install pandas matplotlib

      # ============================================================
      # GERAR GRÁFICOS (OPCIONAL)
      # ============================================================
      - name: Gerar gráfico
        run: |
          if [ -f docs/resultados/ordenacao.csv ]; then
            python scripts/generate_chart.py
          fi

      # ============================================================
      # GERAR INDEX.JSON (DEPOIS DOS ARQUIVOS ESTAREM EM DOCS)
      # ============================================================
      - name: Gerar index.json
        run: |
          python scripts/generate_index.py || echo "Sem histórico ainda"

      # ============================================================
      # COMMIT AUTOMÁTICO
      # ============================================================
      - name: Commit automático
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin main --rebase || true

          git add docs/resultados/ || true

          git commit -m "chore: atualiza dados do dashboard automaticamente" || true

          git push || true

      # ============================================================
      # LOG FINAL (URL DO DASHBOARD)
      # ============================================================
      - name: Mostrar URL
        run: echo "Dashboard: https://ivnavalenca.github.io/algolab/"