# ============================================================
# 🚀 ALGOLAB CI/CD PIPELINE
# ============================================================
#
# OBJETIVO:
# Automatizar todo o fluxo do projeto:
#
# ✔ Build do projeto Java (Gradle)
# ✔ Execução de benchmarks
# ✔ Geração de latest.csv
# ✔ Execução da pipeline Python completa
# ✔ Geração de gráficos, badges e relatório
# ✔ Publicação automática no GitHub Pages
#
# ============================================================

name: Algolab Pipeline

# ============================================================
# 🔐 PERMISSÕES
# ============================================================
permissions:
  contents: write   # necessário para commit automático

# ============================================================
# 🔄 DISPARO DO WORKFLOW
# ============================================================
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:   # botão manual (Run workflow)

# ============================================================
# 🧱 JOB 1: BUILD
# ============================================================
jobs:

  build:
    name: 🔧 Build do Projeto Java
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 📥 Clona repositório
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # ☕ Configura Java
      # ------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------------------------------------------
      # 🔐 Permissão para Gradle
      # ------------------------------------------------------
      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # 🧱 Build do projeto
      # ------------------------------------------------------
      - name: Build
        run: ./gradlew clean build

  # =========================================================
  # 📊 JOB 2: BENCHMARK
  # =========================================================
  benchmark:
    name: 📊 Execução de Benchmark
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # ▶️ Executa benchmark (gera latest.csv)
      # ------------------------------------------------------
      - name: Rodar Benchmark
        run: ./gradlew run

      # ------------------------------------------------------
      # 📦 Salva resultados para próximo job
      # ------------------------------------------------------
      - name: Upload resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/

  # =========================================================
  # 🧠 JOB 3: PIPELINE COMPLETA
  # =========================================================
  analytics:
    name: 🧠 Pipeline Completa (Python)
    needs: benchmark
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 📥 Clona repositório
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 📦 Recupera resultados do benchmark
      # ------------------------------------------------------
      - name: Download resultados
        uses: actions/download-artifact@v4
        with:
          name: resultados
          path: resultados/

      # ------------------------------------------------------
      # 🐍 Configura Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # 📦 Instala dependências
      # ------------------------------------------------------
      - name: Instalar dependências
        run: |
          pip install pandas matplotlib numpy scikit-learn plotly

      # ------------------------------------------------------
      # 🚀 Executa pipeline completa
      # ------------------------------------------------------
      - name: Executar pipeline Algolab
        run: python scripts/main_pipeline.py

      # ------------------------------------------------------
      # 📤 Commit automático dos resultados
      # ------------------------------------------------------
      - name: Commit resultados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin main --rebase || true

          git add docs/ graficos/ resultados/

          git commit -m "🤖 atualização automática da pipeline" || echo "Sem mudanças"
          git push || true

      # ------------------------------------------------------
      # 🌐 Deploy no GitHub Pages
      # ------------------------------------------------------
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs