# ============================================================
# 🚀 ALGOLAB CI/CD PIPELINE
# ============================================================
#
# OBJETIVO:
# Automatizar TODO o fluxo do projeto:
#
# ✔ Build do projeto Java (Gradle)
# ✔ Execução de benchmarks
# ✔ Geração de resultados (latest.csv)
# ✔ Execução da pipeline Python
# ✔ Geração de gráficos e badges
# ✔ Correção de paths para GitHub Pages
# ✔ Publicação automática no dashboard
#
# ============================================================

name: Algolab Pipeline

# ============================================================
# 🔐 PERMISSÕES
# ============================================================
permissions:
  contents: write

# ============================================================
# 🔄 DISPARO DO WORKFLOW
# ============================================================
on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

# ============================================================
# 🧱 JOB 1: BUILD
# ============================================================
jobs:

  build:
    name: 🔧 Build do Projeto Java
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 📥 CLONE DO REPOSITÓRIO
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # ☕ CONFIGURA JAVA
      # ------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ------------------------------------------------------
      # 🔐 PERMISSÃO GRADLE
      # ------------------------------------------------------
      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # 🧱 BUILD
      # ------------------------------------------------------
      - name: Build
        run: ./gradlew clean build

  # =========================================================
  # 📊 JOB 2: BENCHMARK
  # =========================================================
  benchmark:
    name: 📊 Execução de Benchmark
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Permissão Gradle
        run: chmod +x gradlew

      # ------------------------------------------------------
      # ▶️ EXECUTA BENCHMARK
      # ------------------------------------------------------
      - name: Rodar Benchmark
        run: ./gradlew run

      # ------------------------------------------------------
      # 📦 SALVA RESULTADOS
      # ------------------------------------------------------
      - name: Upload resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: resultados/

  # =========================================================
  # 🧠 JOB 3: ANALYTICS + DASHBOARD
  # =========================================================
  analytics:
    name: 🧠 Pipeline Completa + Dashboard
    needs: benchmark
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 📥 CLONE
      # ------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 📦 DOWNLOAD RESULTADOS
      # ------------------------------------------------------
      - name: Download resultados
        uses: actions/download-artifact@v4
        with:
          name: resultados
          path: resultados/

      # ------------------------------------------------------
      # 🐍 SETUP PYTHON
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # 📦 DEPENDÊNCIAS
      # ------------------------------------------------------
      - name: Instalar dependências
        run: |
          pip install pandas matplotlib numpy scikit-learn plotly

      # ------------------------------------------------------
      # 🚀 EXECUTA PIPELINE PYTHON
      # ------------------------------------------------------
      - name: Executar pipeline Algolab
        run: python scripts/main_pipeline.py

      # ======================================================
      # 📁 PREPARAR DASHBOARD (CORREÇÃO CRÍTICA)
      # ======================================================
      - name: Preparar estrutura do dashboard
        run: |
          mkdir -p docs/graficos
          mkdir -p docs/assets
          mkdir -p docs/resultados

      # ------------------------------------------------------
      # 📊 COPIAR GRÁFICOS PARA DOCS
      # ------------------------------------------------------
      - name: Copiar gráficos para docs/resultados/graficos
        run: |
          mkdir -p docs/resultados/graficos
          cp -r resultados/graficos/* docs/resultados/graficos/ || true

      # ------------------------------------------------------
      # 🏷️ COPIAR BADGES
      # ------------------------------------------------------
      - name: Copiar badges
        run: |
          cp -r docs/assets/* docs/assets/ || true

      # ------------------------------------------------------
      # 📊 COPIAR RESULTADOS
      # ------------------------------------------------------
      - name: Copiar resultados
        run: |
          cp -r resultados/* docs/resultados/ || true

      # ------------------------------------------------------
      # 📤 COMMIT AUTOMÁTICO
      # ------------------------------------------------------
      - name: Commit resultados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git pull origin main --rebase || true

          git add docs/

          git commit -m "🤖 atualiza dashboard automaticamente" || echo "Sem mudanças"
          git push || true

      # ------------------------------------------------------
      # 🌐 DEPLOY PAGES
      # ------------------------------------------------------
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs