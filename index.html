<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Algolab Dashboard</title>

  <!-- ===================================================== -->
  <!-- 🎨 ESTILO -->
  <!-- ===================================================== -->
  <link rel="stylesheet" href="style.css">

  <!-- ===================================================== -->
  <!-- 📊 CHART -->
  <!-- ===================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

  <!-- ===================================================== -->
  <!-- 🚀 HEADER -->
  <!-- ===================================================== -->
  <h1>🚀 Algolab Dashboard</h1>

  <!-- ===================================================== -->
  <!-- 🏷️ BADGES -->
  <!-- ===================================================== -->
  <div class="card">
    <h2>📊 Status do Projeto</h2>
    <div id="badges"></div>
  </div>

  <!-- ===================================================== -->
  <!-- 🎯 FILTRO -->
  <!-- ===================================================== -->
  <div class="card">
    <h2>🎯 Selecionar Cenário</h2>

    <select id="cenarioSelect">
      <option value="ordenacao">Ordenação</option>
      <option value="busca">Busca</option>
      <option value="estruturas">Estruturas</option>
      <option value="lista03">Lista03</option>
    </select>
  </div>

  <!-- ===================================================== -->
  <!-- 📊 GRÁFICO PRINCIPAL -->
  <!-- ===================================================== -->
  <div class="card fade show" id="graficoContainer">
    <h2>📊 Desempenho</h2>
    <img id="grafico">
  </div>

  <!-- ===================================================== -->
  <!-- 📊 BOXPLOT -->
  <!-- ===================================================== -->
  <div class="card fade show" id="boxplotContainer">
    <h2>📊 Distribuição (Boxplot)</h2>
    <img id="boxplot">
  </div>

  <!-- ===================================================== -->
  <!-- 📈 MÉTRICAS -->
  <!-- ===================================================== -->
  <div class="card fade show">
    <h2>📈 Complexidade (k e R²)</h2>
    <table id="metrics"></table>
  </div>

  <!-- ===================================================== -->
  <!-- 🏆 RANKING -->
  <!-- ===================================================== -->
  <div class="card fade show">
    <h2>🏆 Ranking Inteligente</h2>
    <div id="ranking"></div>
  </div>

  <!-- ===================================================== -->
  <!-- 📈 TIMELINE -->
  <!-- ===================================================== -->
  <div class="card fade show">
    <h2>📈 Evolução Histórica</h2>
    <canvas id="timeline"></canvas>
  </div>

</div>

<!-- ===================================================== -->
<!-- 🚀 SCRIPT -->
<!-- ===================================================== -->
<script src="script.js"></script>

</body>
</html>
