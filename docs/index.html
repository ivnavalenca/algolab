<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Algolab Dashboard</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<header>
    <h1>Algolab Dashboard</h1>
    <p>Análise de Algoritmos</p>
</header>

<div class="container">

    <!-- ====================================================== -->
    <!-- BADGES -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>Status do Projeto</h2>

        <div class="badges">
            <img src="assets/badge_summary.svg">
            <img src="assets/badge_best.svg">
            <img src="assets/badge_quality.svg">
            <img src="assets/badge_trend.svg">
            <img src="assets/badge_project_score.svg">
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- GRÁFICOS -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>Resultados</h2>

        <div class="grid">

            <div class="card">
                <h3>Comparação Geral</h3>
                <img src="../graficos/line_chart.png">
            </div>

            <div class="card">
                <h3>Boxplot</h3>
                <img src="../graficos/boxplot_geral.png">
            </div>

            <div class="card">
                <h3>Comparação Detalhada</h3>
                <img src="../graficos/comparison_chart.png">
            </div>

            <div class="card">
                <h3>Histórico</h3>
                <img src="../assets/history_chart.png">
            </div>

        </div>
    </div>

</div>

<footer>
    Algolab • Dashboard automático
</footer>

</body>
</html>
