<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Algolab Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS EXTERNO -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <h1>Algolab</h1>
  <p class="subtitle">Dashboard de Análise de Algoritmos</p>

  <!-- CONTROLES -->
  <div class="controls">
    <button onclick="toggleTheme()">🌙 Tema</button>
  </div>

  <!-- BADGES -->
  <div class="badges">
    <img src="assets/badge_summary.svg">
    <img src="assets/badge_best.svg">
    <img src="assets/badge_quality.svg">
    <img src="assets/badge_trend.svg">
    <img src="assets/badge_project_score.svg">
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button onclick="showTab('comp')" class="active">Comparação</button>
    <button onclick="showTab('dist')">Distribuição</button>
    <button onclick="showTab('hist')">Histórico</button>
  </div>

  <!-- COMPARAÇÃO -->
  <div id="comp" class="tab">
    <h2>Comparação</h2>

    <div class="grid">
      <img src="resultados/graficos/line_chart.png" onclick="zoom(this)">
      <img src="resultados/graficos/comparison_chart.png" onclick="zoom(this)">
    </div>
  </div>

  <!-- DISTRIBUIÇÃO -->
  <div id="dist" class="tab hidden">
    <h2>Distribuição</h2>

    <div class="grid">
      <img src="resultados/graficos/boxplot_geral.png" onclick="zoom(this)">
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div id="hist" class="tab hidden">
    <h2>Histórico</h2>

    <div class="grid">
      <img src="resultados/graficos/history_chart.png" onclick="zoom(this)">
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    Algolab • Dashboard interativo
  </footer>

</div>

<!-- MODAL ZOOM -->
<div id="modal" class="modal" onclick="closeZoom()">
  <img id="modal-img">
</div>

<!-- JS -->
<script>
function showTab(id) {
  document.querySelectorAll(".tab").forEach(t => t.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");

  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}

function zoom(img) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modal-img").src = img.src;
}

function closeZoom() {
  document.getElementById("modal").style.display = "none";
}

function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
