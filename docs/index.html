<!-- ==========================================================
     DASHBOARD ALGOLAB - VERSÃO EQUILIBRADA
========================================================== -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Algolab Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            background: #e2e8f0;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #cbd5f5;
        }

        h1 {
            margin: 0;
            color: #1d4ed8;
        }

        .container {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 10px;
            color: #1e293b;
        }

        /* GRID SIMPLES */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        /* CARD LEVE */
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
        }

        img {
            width: 100%;
            border-radius: 6px;
        }

        .badges img {
            margin: 5px;
        }

        footer {
            text-align: center;
            padding: 15px;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>Algolab Dashboard</h1>
    <p>Análise de Algoritmos</p>
</header>

<div class="container">

    <!-- ====================================================== -->
    <!-- BADGES -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>Status do Projeto</h2>

        <div class="badges">
            <img src="assets/badge_summary.svg">
            <img src="assets/badge_best.svg">
            <img src="assets/badge_quality.svg">
            <img src="assets/badge_trend.svg">
            <img src="assets/badge_project_score.svg">
        </div>
    </div>

    <!-- ====================================================== -->
    <!-- GRÁFICOS -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>Resultados</h2>

        <div class="grid">

            <div class="card">
                <h3>Comparação Geral</h3>
                <img src="graficos/line_chart.png">
            </div>

            <div class="card">
                <h3>Boxplot</h3>
                <img src="graficos/boxplot_geral.png">
            </div>

            <div class="card">
                <h3>Comparação Detalhada</h3>
                <img src="graficos/comparison_chart.png">
            </div>

            <div class="card">
                <h3>Histórico</h3>
                <img src="assets/history_chart.png">
            </div>

        </div>
    </div>

</div>

<footer>
    Algolab • Dashboard automático
</footer>

</body>
</html>
