<!-- ==========================================================
     DASHBOARD ALGOLAB
========================================================== -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Algolab Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
        }

        header {
            background: #020617;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #1e293b;
        }

        h1 {
            margin: 0;
            color: #38bdf8;
        }

        .container {
            padding: 20px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            border-left: 5px solid #38bdf8;
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: #020617;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: #38bdf8;
        }

        img {
            width: 100%;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }

        .badge {
            margin: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 Algolab Dashboard</h1>
    <p>Análise de Algoritmos - Resultados Automatizados</p>
</header>

<div class="container">

    <!-- ====================================================== -->
    <!-- BADGES -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>🏷️ Status do Projeto</h2>

        <img class="badge" src="assets/badge_summary.svg">
        <img class="badge" src="assets/badge_best.svg">
        <img class="badge" src="assets/badge_quality.svg">
        <img class="badge" src="assets/badge_trend.svg">
        <img class="badge" src="assets/badge_project_score.svg">
    </div>

    <!-- ====================================================== -->
    <!-- GRÁFICOS -->
    <!-- ====================================================== -->
    <div class="section">
        <h2>📊 Visualização dos Resultados</h2>

        <div class="grid">

            <div class="card">
                <h3>📈 Comparação Geral</h3>
                <img src="../graficos/line_chart.png">
            </div>

            <div class="card">
                <h3>📦 Boxplot Geral</h3>
                <img src="../graficos/boxplot_geral.png">
            </div>

            <div class="card">
                <h3>⚖️ Comparação Detalhada</h3>
                <img src="../graficos/comparison_chart.png">
            </div>

            <div class="card">
                <h3>📜 Histórico</h3>
                <img src="assets/history_chart.png">
            </div>

        </div>
    </div>

</div>

<footer>
    <p>Desenvolvido com ❤️ | Algolab</p>
</footer>

</body>
</html>
