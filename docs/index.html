<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Algolab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS EXTERNO -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <h1>Algolab</h1>
  <p class="subtitle">Análise de Algoritmos • Dashboard automático</p>

  <!-- BADGES -->
  <div class="badges">
    <img src="assets/badge_summary.svg">
    <img src="assets/badge_best.svg">
    <img src="assets/badge_quality.svg">
    <img src="assets/badge_trend.svg">
    <img src="assets/badge_project_score.svg">
  </div>

  <!-- GRÁFICOS -->
  <h2>Comparação</h2>

  <div class="grid">
    <img class="chart" src="resultados/graficos/line_chart.png">
    <img class="chart" src="resultados/graficos/comparison_chart.png">
  </div>

  <h2>Distribuição</h2>

  <div class="grid">
    <img class="chart" src="resultados/graficos/boxplot_geral.png">
    <img class="chart" src="assets/history_chart.png">
  </div>

  <!-- FOOTER -->
  <footer>
    Algolab • Gerado automaticamente pelo pipeline
  </footer>

</div>

</body>
</html>
