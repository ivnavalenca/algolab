<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Algolab Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>Algolab</h1>
    <p>Análise de Algoritmos</p>
</header>

<main class="container">

    <!-- STATUS -->
    <section>
        <h2>Status do Projeto</h2>

        <div class="badges">
            <img src="assets/badge_summary.svg">
            <img src="assets/badge_best.svg">
            <img src="assets/badge_quality.svg">
            <img src="assets/badge_trend.svg">
            <img src="assets/badge_project_score.svg">
        </div>
    </section>

    <!-- GRÁFICOS PRINCIPAIS -->
    <section>
        <h2>Comparação de Algoritmos</h2>

        <div class="grid">

            <div class="card">
                <img src="graficos/line_chart.png">
                <p>Comparação geral de desempenho</p>
            </div>

            <div class="card">
                <img src="graficos/comparison_chart.png">
                <p>Comparação detalhada entre algoritmos</p>
            </div>

        </div>
    </section>

    <!-- DISTRIBUIÇÃO -->
    <section>
        <h2>Distribuição dos Resultados</h2>

        <div class="grid">

            <div class="card">
                <img src="graficos/boxplot_geral.png">
                <p>Distribuição estatística (boxplot)</p>
            </div>

            <div class="card">
                <img src="assets/history_chart.png">
                <p>Evolução histórica dos resultados</p>
            </div>

        </div>
    </section>

</main>

<footer>
    <p>Dashboard gerado automaticamente • Algolab</p>
</footer>

</body>
</html>
